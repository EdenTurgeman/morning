# =============================================================================
#  XcodeGen spec — the source of truth for the Xcode project.
# -----------------------------------------------------------------------------
#  Morning.xcodeproj is GENERATED and GITIGNORED. Never open it and add a file
#  through the Xcode UI expecting that to stick: edit this file and re-run
#
#      cd ios && xcodegen generate
#
#  Why: a .pbxproj is a single flat file with machine-assigned identifiers, and
#  two agents adding a file each produce a conflict no one can review. This YAML
#  merges like normal code. Sources are declared by DIRECTORY, so in practice
#  adding a Swift file needs no edit here at all — just re-generate.
#
#  Deliberate choices worth knowing about, all revisitable:
#
#  · SWIFT_VERSION 5.0 (Swift 5 language mode). Not because iOS 18 needs it —
#    because Swift 6 strict concurrency is a wall to walk into on day one with
#    several agents working sequentially through a UI-heavy port. Flip it when
#    the app exists and someone can own the migration in one pass.
#
#  · iOS 18.0, iPhone, portrait. One device, an iPhone 16 Pro. There is no
#    back-compatibility burden and no iPad or Mac target. Do not add one "to be
#    safe" — ios-port/README.md is explicit that the newer APIs are a large part
#    of why this port is worth doing.
#
#  · No widget or Live Activity target yet. ios-port/05-platform.md §7 says
#    propose these, do not assume them. Stubs are at the bottom, commented out.
# =============================================================================

name: Morning

options:
  bundleIdPrefix: com.edenturgeman
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  Morning:
    type: application
    platform: iOS
    sources:
      - path: Morning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edenturgeman.morning
        PRODUCT_NAME: Morning
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Morning
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_TESTABILITY: YES

  MorningTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MorningTests
    dependencies:
      - target: Morning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edenturgeman.morning.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Morning:
    build:
      targets:
        Morning: all
    run:
      config: Debug
      # Uncomment to launch straight into seeded data. See ios/Morning/Debug/Seeds.swift.
      # commandLineArguments:
      #   "-seed six-months": true
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MorningTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

# =============================================================================
#  Not yet — propose before building. ios-port/05-platform.md §4 and §7.
#
#  The rest timer is close to a perfect Live Activity: Text(timerInterval:)
#  counts down on the Lock Screen and in the Dynamic Island with no updates
#  from the app at all. The user has asked about this specifically. It is also
#  the feature most likely to become annoying if overdone — prototype, do not
#  assume. Same for the week widget and HealthKit.
#
#  When it is agreed, this is roughly the shape:
#
#  MorningWidgets:
#    type: app-extension
#    platform: iOS
#    sources:
#      - path: MorningWidgets
#    settings:
#      base:
#        PRODUCT_BUNDLE_IDENTIFIER: com.edenturgeman.morning.widgets
#        GENERATE_INFOPLIST_FILE: YES
#        INFOPLIST_KEY_CFBundleDisplayName: Morning
#        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
#    dependencies:
#      - sdk: WidgetKit.framework
#      - sdk: SwiftUI.framework
#
#  ...and the app target gains INFOPLIST_KEY_NSSupportsLiveActivities: YES plus
#  an app group if the widget needs to read the history.
# =============================================================================
